# pmcp aa-most-feeder settings, Android Auto (experimental branch, one mode "gamma", audit A-AA20..A-AA30):
# - MOST: the feeder takes the AID video channel (our bridge) and waits up to 20 s while CarPlay's bridge still holds it;
# - start: 5 s after the takeover before the stream connects (the hook grants the phone only then), then the phone's first
#   IDR is repeated every 0.5 s for 3 s while its ACK is held, the frames sent meanwhile follow in order (start sync);
# - pacing: frames go into the ring at most 6 Mbit/s (A-AA34; 2 Mbit/s was below the phone's ~2 Mbit/s average) with 64 KB to spare; the frames after a large one wait (ACKs too);
#   v10 (A-AA33): at least 20 ms between two frames, so the bridge (latency reset over ~188 KB queued) never gets a burst, also not after
#   the start hold; a 3/4 full queue drains at up to 8 Mbit/s; the bridge's IDR request is counted only (no focus cycle).
# The phone sends one key frame per session, so a picture the AID loses stays lost until the next connection (open issue).
PMCP_AA_MODE=most
PMCP_AA_PACE_KBPS=6000
PMCP_AA_PACE_BURST_KB=64
PMCP_AA_SETTLE_MS=5000
PMCP_AA_SYNC_HOLD_MS=3000
PMCP_AA_SYNC_REPEAT_MS=500
PMCP_AA_PACE_GAP_MS=20
PMCP_AA_KF_BRIDGE=0
