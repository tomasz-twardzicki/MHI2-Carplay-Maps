# pmcp experimental Android Auto: settings of the MacsInSpace gal hook on MU1161 / AID 791 (read via GAL_HOOK_CONF).
# Only GAL_ keys count; the gal wrapper sets GAL_HOOK_CONF, GAL_PLAYER_PATH, GAL_HOOK_LOG and GAL_HOOK_LOG_MAX_KB itself.
# Values: MacsInSpace's defaults for VW (enable_hook.sh, beta14), except the output mode (our feeder, not stream-player).
GAL_DUALSCREEN_ENABLE=1
GAL_DUALSCREEN_DEBUG=0
# do not decode in gal: frames go to the player socket (our aa-most-feeder)
GAL_DUALSCREEN_OUTPUT=withhold
# protocol 1.7 (AA 3 (1.7) and AA gamma; AA 1, AA 2 and AA 3 (1.5) use gal-hook.conf with 1.5). At 1.5 the Passat B8 MU1161 report
# (MacsInSpace #47) ran; from 1.6 Google Maps sends navigation
# messages this receiver (1.2) rejects. Native VW arrows for AA would also need adi961's VCAndroidAuto.jar (not installed:
# on VW it blanks the cluster map when a route starts)
GAL_DUALSCREEN_AAP_MINOR=7
GAL_DUALSCREEN_CLUSTER_INPUT=1
GAL_SECONDARY_AAP_DISPLAY_ID=1
GAL_SECONDARY_SERVICE_ID=0
# the cluster stream: 800x480 is the only size the AID takes
GAL_SECONDARY_WIDTH=800
GAL_SECONDARY_HEIGHT=480
GAL_SECONDARY_FPS=30
GAL_SECONDARY_DPI=138
GAL_SECONDARY_VIEWING_DISTANCE=700
GAL_SECONDARY_PIXEL_ASPECT_RATIO_E4=10000
# top,bottom,left,right (VW values owners settled on; to tune in the car)
GAL_SECONDARY_INSETS=52,82,127,127
GAL_SECONDARY_UI_THEME=0
# context and display the hook puts back (VW map, displayable 33) if it ever has to kill the player itself
GAL_VC_CONTEXT=70
GAL_VC_DISPLAY=4
GAL_VC_RESTORE_DISPLAYABLE_ID=33
GAL_STREAM_ENABLE=1
GAL_FIX_STREAM_TIMING=0
# AA gamma: Google Maps manoeuvres (0x8006/0x8007/0x8003) -> rg RAM mailbox /ramdisk/pmcp-aa-rg/latest.bin (synthetic iAP2
# route guidance, no ETA / remaining distance) + /ramdisk/pmcp-aa-rg.txt for AA status (pmcp_rg.c, gamma hook only)
GAL_PMCP_RG=1
